<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#EAE8E3;font-family:Sora,'Segoe UI',sans-serif;padding:24px}
h1{text-align:center;font-size:18px;color:#3E5C4F;margin:0 0 4px}
p.sub{text-align:center;color:#6B6862;font-size:13px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;max-width:1080px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 14px 30px rgba(0,0,0,.14);text-align:center}
.card img{width:100%;border-radius:8px;border:1px solid #EDE9DE}
.card p{font-size:12px;color:#555;margin:10px 0 2px;font-weight:600}
</style>
</head>
<body>
<h1>Verifikasi Tampilan Mobile CatatKu</h1>
<p class="sub">Tanpa horizontal overflow &bull; logo 32&times;32 utuh (tidak mengecil) &bull; FAB tampil &bull; zoom diizinkan</p>
<div class="grid">
  <div class="card"><img src="iPhone12.png"><p>iPhone 12 &mdash; 390px</p></div>
  <div class="card"><img src="iPhoneSE.png"><p>iPhone SE &mdash; 375px</p></div>
  <div class="card"><img src="narrow320.png"><p>Narrow &mdash; 320px</p></div>
  <div class="card"><img src="Pixel5.png"><p>Pixel 5 &mdash; 393px</p></div>
  <div class="card"><img src="iPad11.png"><p>iPad (portrait)</p></div>
</div>
</body>
</html>
